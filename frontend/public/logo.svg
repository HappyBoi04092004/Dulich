<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Robot Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Visor Glass Reflection -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Eye Glow Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Earphone Pink Accent -->
    <linearGradient id="earAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Antenna Orb Glow -->
    <radialGradient id="orbGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Dropshadow filter for glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4c0519" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGlow)"/>

  <!-- Tech Radar Rings / Orbit Lines -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#fda4af" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Sparkle Stars -->
  <path d="M 90 120 Q 95 135 110 140 Q 95 145 90 160 Q 85 145 70 140 Q 85 135 90 120 Z" fill="#fecdd3" opacity="0.8"/>
  <path d="M 420 140 Q 424 152 436 156 Q 424 160 420 172 Q 416 160 404 156 Q 416 152 420 140 Z" fill="#67e8f9" opacity="0.85"/>
  <circle cx="115" cy="380" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="410" cy="360" r="5" fill="#fecdd3" opacity="0.7"/>

  <!-- Robot Group with Soft Shadow -->
  <g filter="url(#softShadow)">

    <!-- Antenna Signal Waves -->
    <path d="M 232 46 A 32 32 0 0 1 280 46" fill="none" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 220 32 A 48 48 0 0 1 292 32" fill="none" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

    <!-- Antenna Pole & Base -->
    <rect x="251" y="65" width="10" height="42" rx="5" fill="#94a3b8"/>
    <!-- Antenna Glowing Orb -->
    <circle cx="256" cy="58" r="16" fill="url(#orbGlow)" filter="url(#cyanGlow)"/>
    <circle cx="252" cy="53" r="5" fill="#ffffff" opacity="0.8"/>

    <!-- Neck / Collar Joint -->
    <path d="M 220 375 L 292 375 L 282 410 L 230 410 Z" fill="#64748b"/>
    <rect x="236" y="388" width="40" height="6" rx="3" fill="#06b6d4" opacity="0.9" filter="url(#cyanGlow)"/>

    <!-- Robot Chest / Body Armor (Slightly visible at bottom) -->
    <path d="M 160 405 C 160 405 210 392 256 392 C 302 392 352 405 352 405 C 375 422 390 455 396 490 C 350 504 304 512 256 512 C 208 512 162 504 116 490 C 122 455 137 422 160 405 Z" fill="url(#chassisGrad)"/>
    <!-- Travel Compass Emblem on Chest -->
    <circle cx="256" cy="442" r="22" fill="#0f172a"/>
    <polygon points="256,426 261,440 274,442 261,444 256,458 251,444 238,442 251,440" fill="#f43f5e"/>
    <polygon points="256,426 261,440 256,442 251,440" fill="#fb7185"/>
    <polygon points="256,458 261,444 256,442 251,444" fill="#be123c"/>

    <!-- Earphone Left -->
    <rect x="88" y="200" width="36" height="78" rx="18" fill="url(#earAccent)"/>
    <rect x="94" y="210" width="10" height="58" rx="5" fill="#ffffff" opacity="0.3"/>
    <!-- Earphone Right -->
    <rect x="388" y="200" width="36" height="78" rx="18" fill="url(#earAccent)"/>
    <rect x="408" y="210" width="10" height="58" rx="5" fill="#ffffff" opacity="0.3"/>

    <!-- Head Chassis Outer -->
    <rect x="112" y="102" width="288" height="276" rx="110" fill="url(#chassisGrad)"/>

    <!-- Head Highlight Rim (Top-left light) -->
    <path d="M 160 114 Q 256 106 352 114" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- Dark Visor Screen Inner -->
    <rect x="142" y="146" width="228" height="182" rx="72" fill="url(#visorGrad)"/>
    <rect x="142" y="146" width="228" height="182" rx="72" fill="none" stroke="#334155" stroke-width="3"/>

    <!-- Visor Glass Reflection Curve -->
    <path d="M 162 162 Q 256 148 335 175 C 342 195 330 220 310 220 C 240 220 180 185 162 162 Z" fill="url(#glassReflect)"/>

    <!-- AI Cyan Glowing Eyes -->
    <!-- Left Eye -->
    <g filter="url(#cyanGlow)">
      <!-- Oval rounded eye with lively arched curve -->
      <ellipse cx="206" cy="226" rx="24" ry="28" fill="url(#eyeGrad)"/>
      <!-- Inner pupil / sparkle glint -->
      <circle cx="214" cy="216" r="9" fill="#ffffff"/>
      <circle cx="198" cy="236" r="4" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Right Eye -->
    <g filter="url(#cyanGlow)">
      <!-- Oval rounded eye with lively arched curve -->
      <ellipse cx="306" cy="226" rx="24" ry="28" fill="url(#eyeGrad)"/>
      <!-- Inner pupil / sparkle glint -->
      <circle cx="314" cy="216" r="9" fill="#ffffff"/>
      <circle cx="298" cy="236" r="4" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Cute Pink Cheeks -->
    <ellipse cx="178" cy="268" rx="14" ry="7" fill="#fb7185" opacity="0.75" filter="url(#cyanGlow)"/>
    <ellipse cx="334" cy="268" rx="14" ry="7" fill="#fb7185" opacity="0.75" filter="url(#cyanGlow)"/>

    <!-- Cute LED Friendly Smile -->
    <path d="M 234 266 Q 256 284 278 266" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#cyanGlow)"/>

  </g>
</svg>

